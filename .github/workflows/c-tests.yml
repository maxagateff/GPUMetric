name: C Core Tests

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-tests:
    name: C Core / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc

          - compiler: Clang
            cc: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: |
          cmake --build build-ci --parallel

      - name: Run CTest
        run: |
          ctest --test-dir build-ci --output-on-failure --no-tests=error --parallel 2

      - name: Show test results
        if: always()
        run: |
          find build-ci/Testing -type f 2>/dev/null || true

  sanitizers:
    name: AddressSanitizer / UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-sanitizers \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: |
          cmake --build build-sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build-sanitizers --output-on-failure --no-tests=error