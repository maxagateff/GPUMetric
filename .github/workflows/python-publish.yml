# This workflow builds and publishes the GPUMetric Python package to PyPI.

name: Upload Python Package

on:
  push:
    branches:
      - master

  release:
    types: [published]

permissions:
  contents: read


jobs:
  release-build:
    name: Build release distributions (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      - name: Show Python version
        run: |
          python --version
          python -c "import sys; print(sys.version)"


      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build auditwheel


      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            libnvidia-ml-dev


      - name: Verify NVML development files
        run: |
          echo "=== NVML header ==="
          dpkg -L libnvidia-ml-dev | grep '/nvml.h$'

          echo "=== NVML library ==="
          dpkg -L libnvidia-ml-dev | grep 'libnvidia-ml.so' || true


      - name: Build Linux wheel
        run: |
          rm -rf dist
          mkdir -p dist

          python -m build \
            --wheel \
            --outdir dist/


      - name: Inspect wheel
        run: |
          echo "=== Built wheels ==="
          ls -lah dist/


      - name: Repair Linux wheel
        run: |
          rm -rf repaired
          mkdir -p repaired

          auditwheel repair \
            --plat manylinux_2_28_x86_64 \
            --wheel-dir repaired \
            dist/*.whl

          rm -f dist/*.whl
          mv repaired/*.whl dist/


      - name: Verify repaired wheel
        run: |
          echo "=== Final wheels ==="
          ls -lah dist/

          echo "=== Wheel contents ==="
          python -m zipfile -l dist/*.whl


      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error


  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    needs: release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/gpumetric


    steps:
      - name: Retrieve all release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-dists-py*
          path: dist/
          merge-multiple: true


      - name: Verify distributions before publishing
        run: |
          echo "=== Packages to publish ==="
          ls -lah dist/


      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/