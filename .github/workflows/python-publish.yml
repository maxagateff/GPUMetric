name: Upload Python Package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cibuildwheel

      - name: Build Linux wheel
        env:
          CIBW_BUILD: cp311-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD_VERBOSITY: 1

          CIBW_BEFORE_ALL_LINUX: |
            dnf install -y wget
            wget -O /usr/include/nvml.h \
              https://raw.githubusercontent.com/NVIDIA/nvidia-sdk/master/nvml/nvml.h

        run: |
          python -m cibuildwheel --output-dir dist/

      - name: Build source distribution
        run: |
          python -m build --sdist --outdir dist/

      - name: Verify distributions
        run: |
          ls -lah dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/gpumetric

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Verify distributions before publishing
        run: |
          ls -lah dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/