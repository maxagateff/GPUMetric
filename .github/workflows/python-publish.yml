# This workflow builds and publishes the GPUMetric Python package to PyPI.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build auditwheel

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libnvidia-ml-dev

      - name: Verify NVML installation
        run: |
          ls -l /usr/include/nvml.h

      - name: Build Linux wheel
        run: |
          python -m build --wheel --outdir dist/

      - name: Repair Linux wheel
        run: |
          mkdir -p repaired

          auditwheel repair \
            --plat manylinux_2_28_x86_64 \
            --wheel-dir repaired \
            dist/*.whl

          rm dist/*.whl
          mv repaired/*.whl dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/gpumetric

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Verify distributions before publishing
        run: |
          echo "=== Packages to publish ==="
          ls -lah dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
