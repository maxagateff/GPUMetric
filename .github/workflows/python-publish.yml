# This workflow builds and publishes the GPUMetric Python package to PyPI.
name: Upload Python Package

on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Build release distributions
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: |
          python --version
          python -c "import sys; print(sys.version)"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build auditwheel

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libnvidia-ml-dev

      - name: Verify NVML development files
        run: |
          echo "=== NVML header ==="
          dpkg -L libnvidia-ml-dev | grep '/nvml.h$'

          echo "=== NVML library ==="
          dpkg -L libnvidia-ml-dev | grep 'libnvidia-ml.so' || true

      - name: Build Linux wheel
        run: |
          python -m build --wheel --outdir dist/

      - name: Inspect wheel
        run: |
          ls -lah dist/

      - name: Repair Linux wheel
        run: |
          mkdir -p repaired

          auditwheel repair \
            --plat manylinux_2_28_x86_64 \
            --wheel-dir repaired \
            dist/*.whl

          rm -f dist/*.whl
          mv repaired/*.whl dist/

      - name: Verify repaired wheel
        run: |
          ls -lah dist/
          python -m zipfile -l dist/*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/gpumetric

    steps:
      - name: Retrieve Python 3.11 distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists-py3.11
          path: dist/

      - name: Retrieve Python 3.12 distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists-py3.12
          path: dist/

      - name: Verify distributions before publishing
        run: |
          echo "=== Packages to publish ==="
          ls -lah dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/